name: Employee Management CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: employee_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
             python -m pip install --upgrade pip setuptools
             pip install -r requirements.txt

          
      - name: Black formatting check
        run: |
          black --check .


      - name: Ruff lint
        run: |
          ruff check .


      - name: Flake8 lint
        run: |
          flake8 .

      - name: Bandit security scan
        run: |
          bandit -r app


      - name: Dependency vulnerability scan
        run: |
          pip-audit

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:admin123@localhost:5432/employee_db
        run: |
          PYTHONPATH=. pytest
